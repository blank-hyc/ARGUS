<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGUS-VisionEcho (Robofest Edition)</title>

    <style>
        :root { 
            --bg: #020617; 
            --card: #0f172a; 
            --accent: #38bdf8; 
            --green: #10b981; 
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 30px;
            max-width: 440px;
            width: 92%;
            text-align: center;
            border: 1px solid #1e293b;
            pointer-events: none;
        }
        #log {
            pointer-events: auto;
            background: #0005;
            padding: 15px;
            border-radius: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .highlight { 
            color: var(--accent); 
            font-weight: bold; 
        }
        .shop-item { 
            padding: 6px 0; 
            border-bottom: 1px solid #1e293b; 
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>ARGUS</h2>
        <div id="statusTxt">System initializing...</div>

        <div style="height: 260px; background: #000; border-radius: 20px; margin: 15px 0; overflow: hidden; border: 2px solid #1e293b;">
            <video id="webcam" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        </div>

        <div id="log">Waiting for command...</div>
        <canvas id="canvas" style="display: none;"></canvas>
    </div>

    <script>
        // ⚠️ 請在此填入你「全新申請」的 Gemini API Key
        const KEY = "AIzaSyDKRVq41XZ0LOBA2-is1MnwLAGza5uRDjg";
        const MODEL = "gemini-2.5-flash"; 

        // 🛡️ Overpass API 備用伺服器清單 (防止 403 錯誤)
        const OVERPASS_ENDPOINTS = [
            "https://overpass-api.de/api/interpreter",
            "https://lz4.overpass-api.de/api/interpreter",
            "https://overpass.kumi.systems/api/interpreter"
        ];

        const video = document.getElementById("webcam");
        const canvas = document.getElementById("canvas");
        const log = document.getElementById("log");
        const statusTxt = document.getElementById("statusTxt");

        let currentFacingMode = "environment";
        let currentStream = null;
        let autoInterval = null;
        let pressTimer;
        let isLongPress = false;
        let isProcessing = false;
        let clickCount = 0;
        let clickTimer = null;
        let speechQueue = [];
        let speaking = false;
        let hasPlayedIntro = false; 

        /* ================= 語音系統 (English) ================= */

        function speak(text) {
            speechQueue.push(text);
            processSpeech();
        }

        function processSpeech() {
            if (speaking || speechQueue.length === 0) return;
            speaking = true;

            const text = speechQueue.shift();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = "en-US"; 
            u.rate = 1.05;
            u.onend = () => {
                speaking = false;
                processSpeech();
            };
            window.speechSynthesis.speak(u);
        }

        function stopSpeech() {
            window.speechSynthesis.cancel();
            speechQueue = [];
            speaking = false;
        }

        function introGuide() {
            speak("System activated.");
            speak("Single tap to identify objects.");
            speak("Double tap to switch camera.");
            speak("Triple tap for auto-recognition.");
            speak("Four taps to navigate to nearest place.");
            speak("Long press to scan surroundings.");
        }

        /* ================= 相機控制 ================= */

        async function startCamera(mode) {
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
                video.srcObject = stream;
                currentStream = stream;
                video.style.transform = mode === "user" ? "scaleX(-1)" : "scaleX(1)";
                statusTxt.innerText = "● System Ready";
                
                if (!hasPlayedIntro) {
                    setTimeout(introGuide, 800);
                    hasPlayedIntro = true; 
                }
            } catch {
                log.innerHTML = "Camera access denied.";
            }
        }
        startCamera(currentFacingMode);

        function switchCamera() {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            startCamera(currentFacingMode);
            stopSpeech();
            speak("Camera switched.");
        }

        /* ================= AI 視覺辨識 (Gemini) ================= */

        async function analyze() {
            if (isProcessing) return;
            stopSpeech();
            isProcessing = true;
            log.innerHTML = "Analyzing image...";

            const ctx = canvas.getContext("2d");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const base64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "You are an AI guide for the visually impaired. Describe the most important object or obstacle ahead in under 10 words. If the path is clear, prioritize announcing nearby shops, signs, or traffic lights." },
                                { inline_data: { mime_type: "image/jpeg", data: base64 } }
                            ]
                        }]
                    })
                });
                const data = await res.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Unable to recognize.";
                log.innerHTML = `<span class="highlight">${text}</span>`;
                speak(text);
            } catch {
                log.innerHTML = "Recognition failed. Check API Key or Network.";
            }
            isProcessing = false;
        }

        /* ================= 🛡️ Overpass API 備援連線模組 ================= */

        async function fetchOverpass(query) {
            for (let endpoint of OVERPASS_ENDPOINTS) {
                try {
                    const res = await fetch(endpoint, {
                        method: "POST", 
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: "data=" + encodeURIComponent(query)
                    });
                    if (res.ok) {
                        return await res.json();
                    } else {
                        console.warn(`Endpoint ${endpoint} error: ${res.status}`);
                    }
                } catch (err) {
                    console.warn(`Endpoint ${endpoint} failed`, err);
                }
            }
            throw new Error("All Overpass endpoints failed.");
        }

        /* ================= 空間雷達 (長按) ================= */

        async function locate() {
            if (isProcessing) return;
            stopSpeech();
            isProcessing = true;
            log.innerHTML = "Scanning surroundings...";

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude: lat, longitude: lon } = pos.coords;

                try {
                    const query = `[out:json];(node(around:200,${lat},${lon})["name"]["shop"];node(around:200,${lat},${lon})["name"]["amenity"];);out;`;
                    
                    // 使用備援模組發送請求
                    const osmJson = await fetchOverpass(query);

                    if (!osmJson.elements || !osmJson.elements.length) {
                        speak("No places found nearby.");
                        log.innerHTML = "No places found nearby.";
                        isProcessing = false;
                        return;
                    }

                    let names = [];
                    let html = "";
                    osmJson.elements.forEach(e => {
                        const name = e.tags.name;
                        if (name && !names.includes(name)) {
                            names.push(name);
                            html += `<div class="shop-item">${name}</div>`;
                        }
                    });
                    log.innerHTML = html;

                    speak(`Found ${names.length} places nearby.`);
                    names.forEach((n) => speak(n));

                } catch (err) {
                    log.innerHTML = "Scan failed. Servers might be busy.";
                    console.error(err);
                }
                isProcessing = false;
            }, () => {
                log.innerHTML = "GPS disabled.";
                isProcessing = false;
            });
        }

        /* ================= 導航數學演算法 ================= */
        
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const p1 = lat1 * Math.PI/180;
            const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function getCompassDirection(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const l1 = lat1 * Math.PI / 180;
            const l2 = lat2 * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(l2);
            const x = Math.cos(l1) * Math.sin(l2) - Math.sin(l1) * Math.cos(l2) * Math.cos(dLon);
            let brng = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
            const directions = ["North", "North East", "East", "South East", "South", "South West", "West", "North West"];
            return directions[Math.round(brng / 45) % 8];
        }

        /* ================= 最近地標導航 (四擊) ================= */

        async function navigateToNearest() {
            if (isProcessing) return;
            stopSpeech();
            isProcessing = true;
            log.innerHTML = "Calculating route...";
            speak("Finding nearest destination.");

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude: lat, longitude: lon } = pos.coords;

                try {
                    const query = `[out:json];(node(around:500,${lat},${lon})["name"]["shop"];node(around:500,${lat},${lon})["name"]["amenity"];);out center;`;
                    
                    // 使用備援模組發送請求
                    const osmJson = await fetchOverpass(query);

                    if (!osmJson.elements || !osmJson.elements.length) {
                        speak("No navigable places found nearby.");
                        log.innerHTML = "No places found.";
                        isProcessing = false;
                        return;
                    }

                    let nearest = null;
                    let minDist = Infinity;

                    osmJson.elements.forEach(e => {
                        if(e.tags && e.tags.name) {
                            let eLat = e.lat || e.center.lat;
                            let eLon = e.lon || e.center.lon;
                            let dist = getDistance(lat, lon, eLat, eLon);
                            if (dist < minDist && dist > 5) { 
                                minDist = dist;
                                nearest = { name: e.tags.name, lat: eLat, lon: eLon, dist: dist };
                            }
                        }
                    });

                    if (nearest) {
                        let direction = getCompassDirection(lat, lon, nearest.lat, nearest.lon);
                        let text = `Nearest destination is ${nearest.name}, ${nearest.dist} meters to the ${direction}.`;
                        log.innerHTML = `Navigating to:<br><span class="highlight">${nearest.name}</span><br>${nearest.dist}m ${direction}`;
                        speak(text);
                    } else {
                        speak("You have arrived at the nearest location.");
                    }

                } catch (err) {
                    log.innerHTML = "Navigation failed. Servers might be busy.";
                    speak("Navigation failed.");
                    console.error(err);
                }
                isProcessing = false;
            }, () => {
                log.innerHTML = "GPS disabled.";
                speak("GPS access required for navigation.");
                isProcessing = false;
            });
        }

        /* ================= FSM 無視覺化手勢操作 ================= */

        document.body.addEventListener("pointerdown", (e) => {
            isLongPress = false; 
            pressTimer = setTimeout(() => {
                isLongPress = true; 
                locate();
            }, 1500); 
        });

        document.body.addEventListener("pointerup", (e) => {
            clearTimeout(pressTimer); 
            if (isLongPress) return; 

            clickCount++;
            clearTimeout(clickTimer); 

            clickTimer = setTimeout(() => {
                if (clickCount === 1) {
                    analyze(); 
                } 
                else if (clickCount === 2) {
                    switchCamera(); 
                } 
                else if (clickCount === 3) {
                    if (autoInterval) {
                        clearInterval(autoInterval);
                        autoInterval = null;
                        speak("Auto-recognition disabled.");
                        log.innerHTML = "Auto-recognition: <span style='color:red;'>OFF</span>";
                    } else {
                        autoInterval = setInterval(analyze, 15000);
                        speak("Auto-recognition enabled.");
                        log.innerHTML = "Auto-recognition: <span style='color:var(--green);'>ON</span>";
                        analyze(); 
                    }
                }
                else if (clickCount >= 4) {
                    navigateToNearest(); 
                }
                clickCount = 0; 
            }, 400); 
        });
    </script>
</body>
</html>
