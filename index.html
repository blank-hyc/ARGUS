<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGUS-VisionEcho V4.8 (完整整合版)</title>

    <style>
        :root { 
            --bg: #020617; 
            --card: #0f172a; 
            --accent: #38bdf8; 
            --green: #10b981; 
            --warn: #fbbf24;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 30px;
            max-width: 440px;
            width: 92%;
            text-align: center;
            border: 1px solid #1e293b;
            pointer-events: none;
        }
        #log {
            pointer-events: auto;
            background: #0005;
            padding: 15px;
            border-radius: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .highlight { color: var(--accent); font-weight: bold; }
        .nav-dir { color: var(--warn); font-size: 1.4rem; font-weight: 800; display: block; margin-top: 5px; }
        .blinking { animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>

<body>
    <div class="card">
        <h2>ARGUS <small style="font-size: 0.6em; opacity: 0.6;">V4.8</small></h2>
        <div id="statusTxt">點擊螢幕任何地方開始...</div>

        <div style="height: 260px; background: #000; border-radius: 20px; margin: 15px 0; overflow: hidden; border: 2px solid #1e293b; position: relative;">
            <video id="webcam" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
            <div id="compassDebug" style="position: absolute; bottom: 5px; right: 10px; font-size: 10px; color: #fff5;">方位: --°</div>
        </div>

        <div id="log">等待指令中...</div>
        <canvas id="canvas" style="display: none;"></canvas>
    </div>

    <script>
        const KEY = "AIzaSyCbXQjFKiq5emmeJugzayHbV4sVVKMeX68";
        const MODEL = "gemini-2.5-flash"; 
        const OVERPASS_ENDPOINTS = ["https://overpass-api.de/api/interpreter", "https://lz4.overpass-api.de/api/interpreter"];

        const video = document.getElementById("webcam");
        const canvas = document.getElementById("canvas");
        const log = document.getElementById("log");
        const statusTxt = document.getElementById("statusTxt");

        let currentStream = null; 
        let currentFacingMode = "environment";
        let isProcessing = false;
        let clickCount = 0;
        let clickTimer = null;
        let autoInterval = null;
        let hasPlayedIntro = false;

        // 長按計時
        let timer1s, timer3s, timer5s;
        let longPressLevel = 0; 

        // 導航與位置
        let userHeading = 0; 
        let isListening = false;
        let currentTranscript = "";
        let isNavigating = false;
        let navWatchId = null;
        let navTarget = null;
        let lastSpeakTime = 0; 

        /* ================= 系統工具 (TTS, 指南針) ================= */
        function initCompass() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => { if (res == 'granted') window.addEventListener('deviceorientation', handleOrientation, true); });
            } else { window.addEventListener('deviceorientation', handleOrientation, true); }
        }
        function handleOrientation(e) {
            let h = e.webkitCompassHeading || (360 - e.alpha);
            if (h) { userHeading = h; document.getElementById("compassDebug").innerText = `方位: ${Math.round(userHeading)}°`; }
        }

        let speechQueue = [];
        let speaking = false;
        function speak(text, lang = "zh-TW") {
            speechQueue.push({ text, lang });
            if (!speaking) processSpeech();
        }
        function processSpeech() {
            if (speechQueue.length === 0) { speaking = false; return; }
            speaking = true;
            const item = speechQueue.shift();
            const u = new SpeechSynthesisUtterance(item.text);
            u.lang = item.lang;
            u.onend = () => processSpeech();
            window.speechSynthesis.speak(u);
        }
        function stopSpeech() { window.speechSynthesis.cancel(); speechQueue = []; speaking = false; }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        /* ================= 🎤 語音辨識功能 ================= */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if (recognition) { recognition.lang = 'zh-TW'; recognition.continuous = true; recognition.interimResults = true; }

        async function startVoiceNavigation() {
            initCompass(); stopSpeech();
            isListening = true; currentTranscript = "";
            speak("請說出您的目的地。", "zh-TW");
            log.innerHTML = "聆聽中... (點擊 5 次確認)";
            recognition.onresult = (e) => {
                currentTranscript = Array.from(e.results).map(r => r[0].transcript).join('');
                log.innerHTML = `搜尋中: <span class="highlight">${currentTranscript}</span>`;
            };
            recognition.start();
        }

        /* ================= 🟢 導航與地標搜尋 ================= */
        async function searchPlaces(targetName = null, limit = 1) {
            isProcessing = true;
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude: lat, longitude: lon } = pos.coords;
                try {
                    let query = targetName 
                        ? `[out:json];(node(around:3000,${lat},${lon})["name"~"${targetName}",i];way(around:3000,${lat},${lon})["name"~"${targetName}",i];);out center;`
                        : `[out:json];(node(around:1000,${lat},${lon})["name"]["shop"];node(around:1000,${lat},${lon})["name"]["amenity"];);out center;`;
                    
                    const res = await fetch(OVERPASS_ENDPOINTS[0], { method: "POST", body: "data=" + encodeURIComponent(query) });
                    const data = await res.json();

                    if (!data.elements.length) { speak("附近找不到相關地點。", "zh-TW"); isProcessing = false; return; }

                    let places = data.elements.map(e => ({
                        name: e.tags.name,
                        lat: e.lat || e.center.lat,
                        lon: e.lon || e.center.lon,
                        dist: getDistance(lat, lon, e.lat || e.center.lat, e.lon || e.center.lon)
                    })).sort((a, b) => a.dist - b.dist);

                    if (limit === 1) {
                        navTarget = places[0];
                        startLiveTracking();
                    } else {
                        let top10 = places.slice(0, 10);
                        let text = top10.map((p, i) => `第${i+1}個，${p.name}，距離 ${p.dist} 公尺。`).join(" ");
                        speak("附近的地點有：" + text, "zh-TW");
                        log.innerHTML = top10.map(p => `• ${p.name} (${p.dist}公尺)`).join("<br>");
                    }
                } catch (e) { speak("連線地圖服務發生錯誤。", "zh-TW"); }
                isProcessing = false;
            });
        }

        function startLiveTracking() {
            isNavigating = true;
            speak(`開始導航至 ${navTarget.name}`, "zh-TW");
            navWatchId = navigator.geolocation.watchPosition((pos) => {
                const { latitude: lat, longitude: lon } = pos.coords;
                let d = getDistance(lat, lon, navTarget.lat, navTarget.lon);
                log.innerHTML = `<span class="blinking" style="color:var(--green)">● 導航中</span><br>${navTarget.name}<br>距離 ${d} 公尺`;
                if (d <= 15) { speak("您已抵達目的地。", "zh-TW"); stopNavigation(); }
            }, null, { enableHighAccuracy: true });
        }

        function stopNavigation() {
            if (navWatchId) navigator.geolocation.clearWatch(navWatchId);
            isNavigating = false; log.innerHTML = "導航已結束。";
        }

        /* ================= 📸 影像分析 ================= */
        async function analyze() {
            if (isProcessing) return; stopSpeech(); isProcessing = true;
            log.innerHTML = "分析中...";
            const ctx = canvas.getContext("2d"); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0); const b64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${KEY}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "請為視障人士用 10 個字以內的繁體中文描述前方的物體。" }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }] })
                });
                const d = await res.json(); const t = d.candidates[0].content.parts[0].text;
                log.innerHTML = `<span class="highlight">${t}</span>`; speak(t, "zh-TW");
            } catch (e) { log.innerHTML = "分析失敗。"; }
            isProcessing = false;
        }

        async function startCamera(mode) {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
            video.srcObject = s; currentStream = s; statusTxt.innerText = "● 系統已就緒";
        }
        startCamera(currentFacingMode);

        /* ================= 🧠 手勢邏輯整合 ================= */
        document.body.addEventListener("pointerdown", (e) => {
            if (!hasPlayedIntro) {
                hasPlayedIntro = true;
                window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); // 解鎖音訊
                speak("ARGUS 已連線。點擊一次進行掃描。", "zh-TW");
                return;
            }

            longPressLevel = 0;
            timer1s = setTimeout(() => {
                longPressLevel = 1;
                if (isListening || isNavigating) {
                    speak("已取消。", "zh-TW");
                    isListening = false; if (recognition) recognition.stop();
                    stopNavigation();
                } else {
                    speak("操作說明：點擊 1 次掃描。點擊 2 次切換鏡頭。點擊 3 次自動掃描。點擊 4 次導航至最近地點。點擊 5 次語音搜尋。長按 5 秒列出附近地點。", "zh-TW");
                }
            }, 1000);

            timer3s = setTimeout(() => {
                longPressLevel = 2;
                speak("現在放開以聆聽操作說明，或繼續長按以取得附近地點列表。", "zh-TW");
            }, 3000);

            timer5s = setTimeout(() => {
                longPressLevel = 3;
                stopSpeech();
                speak("列出附近十個地點...", "zh-TW");
                searchPlaces(null, 10);
            }, 5000);
        });

        document.body.addEventListener("pointerup", (e) => {
            clearTimeout(timer1s); clearTimeout(timer3s); clearTimeout(timer5s);
            if (longPressLevel > 0) return;
            if (!hasPlayedIntro) return;

            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => {
                if (isListening) {
                    if (clickCount >= 5) { isListening = false; recognition.stop(); searchPlaces(currentTranscript, 1); }
                    else { isListening = false; recognition.stop(); speak("已取消。", "zh-TW"); }
                } else if (isNavigating) {
                    if (clickCount >= 5) { stopNavigation(); speak("已取消。", "zh-TW"); }
                    else if (clickCount === 1) { speak("更新中。", "zh-TW"); }
                } else {
                    if (clickCount === 1) analyze();
                    else if (clickCount === 2) { 
                        currentFacingMode = currentFacingMode === "environment" ? "user" : "environment"; 
                        startCamera(currentFacingMode); speak("鏡頭已切換。", "zh-TW"); 
                    }
                    else if (clickCount === 3) {
                        if (autoInterval) { clearInterval(autoInterval); autoInterval = null; speak("自動掃描已關閉。", "zh-TW"); }
                        else { autoInterval = setInterval(analyze, 15000); speak("自動掃描已開啟。", "zh-TW"); analyze(); }
                    }
                    else if (clickCount === 4) {
                        speak("導航至最近地點。", "zh-TW");
                        searchPlaces(null, 1);
                    }
                    else if (clickCount >= 5) {
                        startVoiceNavigation();
                    }
                }
                clickCount = 0;
            }, 450);
        });
    </script>
</body>
</html>
